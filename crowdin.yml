# Crowdin 的 GitHub 整合讀這個檔（https://crowdin.com/project/porchlamps）。
# 只把 zh-TW 當原文上傳，永不寫回 zh-TW；譯文寫到 messages/<BCP-47>/。
# 沒翻的字不匯出（否則中文會被當成譯文）；安全相關的字只匯出作者核准過的。
# 刻意不設 update_option：中文原文改了，那則的譯文就清掉要重翻，照舊原文翻的安全字不會被匯出。
# 不要改成 update_without_changes／update_as_unapproved（主 repo 的 lib/i18n/crowdinTemplate.test.ts 守著）。
preserve_hierarchy: true

# Crowdin 的預設 commit 訊息是「New translations … [ci skip]」：validate、stamp 都不會跑，main 的規則要求的 validate 永遠等不到。
# 換成自己的訊息、不附加預設的：開頭保持「New translations 」，scripts/crowdin-stamp.mjs 靠它認出 Crowdin 的 commit。
commit_message: "New translations %original_file_name% (%language%)"
append_commit_message: false

files:
  - source: /messages/zh-TW/ui.json
    translation: /messages/%locale%/ui.json
    skip_untranslated_strings: true
    languages_mapping:
      locale:
        zh-HK: zh-HK
        en: en
        ja: ja
  - source: /messages/zh-TW/safety.json
    translation: /messages/%locale%/safety.json
    skip_untranslated_strings: true
    export_only_approved: true
    languages_mapping:
      locale:
        zh-HK: zh-HK
        en: en
        ja: ja
